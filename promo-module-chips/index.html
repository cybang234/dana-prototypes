function icon(name, size){

  return `<span style="display:inline-flex;width:${size}px;height:${size}px;flex:none">${svg.replace('<svg ', `<svg style="width:100%;height:100%" `)}</span>`;
}

/* ── 칩 스크롤 엔진 — 선택 항목을 스트립 중앙(확정) / 좌측(이전)으로 ── */
let ALIGN = 'center';
const scrollAnim = new WeakMap();
function scrollSelected(container){
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const chip = container.querySelector('.is-selected'); if (!chip) return;
    const max = container.scrollWidth - container.clientWidth;
    const raw = ALIGN === 'center'
      ? chip.offsetLeft + chip.offsetWidth/2 - container.clientWidth/2   /* 칩 중심 = 컨테이너 중심 */
      : chip.offsetLeft - 16;                                           /* 이전안: 패딩 16 안쪽 좌측 */
    const target = Math.min(Math.max(0, raw), max);
    const from = container.scrollLeft;
    if (Math.abs(target - from) < 1) return;
    cancelAnimationFrame(scrollAnim.get(container));
    const t0 = performance.now(), DUR = 280;
    const tick = now => {
      const p = Math.min(1, (now - t0) / DUR), ease = 1 - Math.pow(1 - p, 3);
      container.scrollLeft = from + (target - from) * ease;
      if (p < 1) scrollAnim.set(container, requestAnimationFrame(tick));
    };
    scrollAnim.set(container, requestAnimationFrame(tick));
  }));
}

/* ── 스트립 렌더러 (4 유형) ── */
const STRIP_TPL = {
  pill:  it => `<button class="pchip">${it.label}</button>`,
  text:  it => `<button class="tchip">${it.label}</button>`,
  date:  it => `<button class="dtab">${it.label}</button>`,
  brand: it => `<button class="bchip"><span class="bc-ring"><span class="bc-thumb"><img src="${it.img}" alt=""></span></span><span class="bc-name">${it.label}</span></button>`,
};
class Strip {
  constructor({ el, type, items, value, onChange, toggleable }){
    Object.assign(this, { el, type, items, value, onChange, toggleable });
    this.render();
  }
  render(){
    this.el.innerHTML = this.items.map(STRIP_TPL[this.type]).join('');
    [...this.el.children].forEach((b, i) => {
      const it = this.items[i];
      b.classList.toggle('is-selected', it.id === this.value);
      b.onclick = () => this.select(it.id, true);
    });
  }
  setItems(items, value){ this.items = items; this.value = value; this.render(); }
  select(id, byUser){
    if (this.value === id){
      if (!(this.toggleable && byUser) || id === this.items[0].id) return;  /* 2Depth: 재탭 = 해제 → 전체 */
      id = this.items[0].id;
    }
    this.value = id; this.render();
    scrollSelected(this.el);
    this.onChange && this.onChange(id, byUser);
  }
}

function reload(body, renderFn){

}

/* 1Depth + 2Depth 조합 (상품목록 / 랭킹 / 개인화) */
function mount2Depth({ strip1El, wrapEl, strip2El, items1, value1, onBody }){
  const st = { cat1:value1, cat2:'all' };
  const subsOf = id => { const c = items1.find(x => x.id === id); return c && c.sub ? [{id:'all',label:'전체'}, ...c.sub.map((l,i)=>({id:'s'+i,label:l}))] : null; };
  let s2;
  const sync2 = () => {
    const subs = subsOf(st.cat1);
    if (!subs){ wrapEl.classList.remove('is-open'); return; }
    s2.setItems(subs, st.cat2); wrapEl.classList.add('is-open');
  };
  const s1 = new Strip({ el:strip1El, type:'pill', items:items1, value:st.cat1, onChange:id => {
    st.cat1 = id; st.cat2 = 'all'; sync2(); scrollSelected(strip2El); onBody(st); updateState();
  }});
  s2 = new Strip({ el:strip2El, type:'text', items:[{id:'all',label:'전체'}], value:'all', toggleable:true, onChange:id => { st.cat2 = id; onBody(st); updateState(); }});
  sync2();
  return st;
}

  { id:'ranking', zone:'빅프로모션', name:'랭킹', chip:'1Depth/2Depth 카테고리 chip', node:'12837-58999', link:'../ranking-module/',
    html: `${head('지금 많이 구매하는 상품','')}<div class="strip-pill" data-strip="s1"></div><div class="strip2-wrap" data-wrap><div class="strip-text" data-strip="s2"></div></div><div class="m-body"><div class="rk-list" data-body></div></div>`,
    init(sec){

      const render = st => { const o = catIdx(CATS, st.cat1)*2 + (st.cat2==='all'?0:+st.cat2.slice(1)); body.innerHTML = [0,1,2,3,4].map(i => `<div class="rk-row"><span class="rk-rank">${i+1}</span>${pRow(i+o)}</div>`).join(''); };
      const st = mount2Depth({ strip1El:$('[data-strip=s1]',sec), wrapEl:$('[data-wrap]',sec), strip2El:$('[data-strip=s2]',sec), items1:CATS, value1:'all', onBody:s => reload(body, () => render(s)) });

  { id:'specialdeal', zone:'빅프로모션', name:'스페셜딜', chip:'1Depth 카테고리 chip', node:'21179-143010',
    html: `${head('단 하루 특가, 스페셜딜','매일 오전 10시에 업데이트 돼요')}<div class="sd-progress"><i></i></div><div class="sd-timer">${icon('clock',14)}종료까지 <b data-timer>12:36:10</b> 남음</div><div class="strip-pill" data-strip="s1"></div><div class="m-body"><div class="hscroll carousel" data-body></div></div>`,

      const render = id => { const o = catIdx(CATS,id)*3; body.innerHTML = [0,1].map(c => `<div class="p-rows" style="gap:12px">${[0,1,2].map(r => row(o+c*3+r)).join('')}</div>`).join(''); body.scrollLeft = 0; };
      new Strip({ el:$('[data-strip=s1]',sec), type:'pill', items:CATS, value:'all', onChange:id => reload(body, () => render(id)) });
      render('all');
      let remain = 12*3600+36*60+10; const t = $('[data-timer]',sec);
      setInterval(() => { remain = Math.max(0,remain-1); const h=String(Math.floor(remain/3600)).padStart(2,'0'), m=String(Math.floor(remain%3600/60)).padStart(2,'0'), s=String(remain%60).padStart(2,'0'); t.textContent=`${h}:${m}:${s}`; }, 1000);

  { id:'personal', zone:'빅프로모션', name:'개인화 모듈 · 2행형', chip:'1Depth/2Depth 카테고리 chip', node:'21179-143017',

/* ══ 마운트 ══ */
const page = $('#page');
page.innerHTML = MODULES.map(m => `<div class="mod-tag" data-tag="${m.id}"><b>${m.zone}</b>${m.name}<span class="ct">${m.chip.replace(/ \(.*\)/,'')}</span></div><section class="mod" id="mod-${m.id}">${m.html}</section>`).join('');
MODULES.forEach(m => m.init($('#mod-'+m.id)));

/* 패널: 모듈 바로가기 + 활성 표시 */
const list = $('#modList');
list.innerHTML = MODULES.map(m => `<button data-go="${m.id}">${m.name}<small>${m.zone}</small></button>`).join('');
list.querySelectorAll('button').forEach(b => b.onclick = () => { page.scrollTo({ top: $('[data-tag="'+b.dataset.go+'"]').offsetTop, behavior:'smooth' }); });
page.addEventListener('scroll', () => {
  const y = page.scrollTop + 120; let active = MODULES[0].id;
  MODULES.forEach(m => { if ($('#mod-'+m.id).offsetTop - 30 <= y) active = m.id; });
  list.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.go === active));
}, { passive:true });

$('#alignSeg').querySelectorAll('button').forEach(b => b.onclick = () => {
  ALIGN = b.dataset.align;
  $('#alignSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.strip-pill, .strip-text, .strip-date, .strip-brand').forEach(scrollSelected);
  updateState();
});
$('#tagToggle').onchange = e => document.body.classList.toggle('hide-tags', !e.target.checked);

function updateState(){
  $('#ppState').textContent = `정렬: ${ALIGN==='center' ? '중앙 (칩 중심 = 스트립 중심)' : '좌측 (패딩 16 안쪽)'}\n` +
    `스트립 ${document.querySelectorAll('.strip-pill, .strip-text, .strip-date, .strip-brand').length}개 · 모듈 ${MODULES.length}개\n` +
    `같은 엔진: scrollSelected(container)`;
}
updateState();
</script>
