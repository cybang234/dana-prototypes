(function applyIcons(){
  let seq = 0;
  document.querySelectorAll('[data-icon]').forEach(el => {
    const name = el.getAttribute('data-icon');
    let svg = window.ICONS[name];
    if (!svg) { console.warn('missing icon:', name); return; }
    const suffix = '__ic' + (seq++);
    svg = svg.replace(/id="([^"]+)"/g, (m, id) => `id="${id}${suffix}"`)

    svg.setAttribute('width','100%'); svg.setAttribute('height','100%');

})();

const SD_CATS = [
  { id:'all', label:'전체' }, { id:'furniture', label:'가구' }, { id:'digital', label:'가전·디지털' },
  { id:'fabric', label:'패브릭' }, { id:'kitchen', label:'주방용품' }, { id:'dressroom', label:'드레스룸' },
];

const TD_DATA = [
  { ...p(T[9],null,'시몬스 뷰티레스트 윌리엄 매트리스 Q','51%','225,000원',4.6,'12,483'), rise:'34,000' },
  { ...p(T[2],null,'클라우드 모션 패브릭 3인 소파','46%','498,000원',4.7,'8,912'), rise:'50,000' },
  { ...p(T[1],null,'호텔식 워싱 차렵이불 풀세트 Q','52%','79,000원',4.8,'31,027'), rise:'12,000' },
  { ...p(T[5],null,'데스커 모션데스크 1400 오크','35%','528,000원',4.8,'1,730'), rise:'21,000' },
  { ...p(T[8],null,'스텐 인덕션 프라이팬 3종 세트','61%','42,900원',4.8,'44,209'), rise:'8,000' },
];

const esc = s => String(s).replace(/</g,'&lt;');

/* ══ DIFF 모드: Figma 시안 더미 콘텐츠로 교체 (pixel-diff 정합용) ══ */
if (DIFF) {
  const PH = IMG + 'thumb-placeholder.png';
  const fig = (brand) => p(PH, brand, 'BELLY30 Pendant 3Colors BELLY30 Pendant 3Colors', '51%', '225,000원', 4.6, '999,999');
  SD_DATA.all = [fig(null), fig(null), fig(null), fig('한샘'), fig('한샘'), fig('한샘')];
  TD_DATA.length = 0;
  for (let i = 0; i < 2; i++) TD_DATA.push({ ...fig(null), rise: '{34,000}' });
}

/* ══ 스페셜딜: chip 필터 + 컬럼 캐러셀 + 스켈레톤 ══ */
const chipStrip = document.getElementById('sd-chips');
const sdCarousel = document.getElementById('sd-carousel');

chipStrip.innerHTML = SD_CATS.map((c,i) =>
  `<button class="chip${i===0?' is-on':''}" data-cat="${c.id}">${c.label}</button>`).join('');

function cardHTML(pr) {
  return `<article class="hcard">
    <div class="thumb"><img src="${pr.img}" alt=""><button class="scrap" aria-label="스크랩"></button></div>
    <div class="txt">
      <div class="title-wrap">
        ${pr.brand ? `<p class="brand">${esc(pr.brand)}</p>` : ''}
        <p class="name">${esc(pr.name)}</p>
        <p class="price"><b class="rate">${pr.rate}</b><b>${pr.price}</b></p>
      </div>
      <p class="review"><span class="star"></span><span>${pr.rating}</span><span>·</span><span>리뷰</span><span>${pr.review}</span></p>
      <p class="delivery">무료배송</p>
    </div>
  </article>`;
}

function renderSD(catId) {
  const items = SD_DATA[catId] || [];
  if (!items.length) {
    sdCarousel.innerHTML = '<div class="empty">노출할 상품이 없어요<br>상품이 준비되면 보여드릴게요</div>';
    return;
  }
  const cols = [];
  for (let i = 0; i < items.length; i += 3) cols.push(items.slice(i, i + 3));
  sdCarousel.innerHTML = cols.map(col => `<div class="col">${col.map(cardHTML).join('')}</div>`).join('');
  sdCarousel.scrollTo({ left: 0 });
}
renderSD('all');

function renderSkeleton() {
  const skelCard = `<article class="hcard">
    <div class="skel skel-thumb"></div>
    <div class="txt" style="gap:8px">
      <div class="skel skel-line" style="width:80%"></div>
      <div class="skel skel-line" style="width:55%"></div>
      <div class="skel skel-line" style="width:40%"></div>
    </div>
  </article>`;
  sdCarousel.innerHTML = `<div class="col">${skelCard.repeat(3)}</div>`;
}

chipStrip.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip || chip.classList.contains('is-on')) return;
  chipStrip.querySelectorAll('.chip').forEach(c => c.classList.toggle('is-on', c === chip));
  /* 선택 chip 좌측 자동 스크롤 — 좌측 패딩 16 안쪽 정렬, 끝쪽 chip은 클램프 (랭킹과 동일) */
  chipStrip.scrollTo({ left: Math.max(0, chip.offsetLeft - 16), behavior: 'smooth' });
  /* 스켈레톤 320ms → 데이터 교체 (랭킹과 동일) */
  const cat = chip.dataset.cat;
  if (!(SD_DATA[cat] || []).length) { renderSD(cat); return; } /* 빈 상태는 즉시 */
  renderSkeleton();
  setTimeout(() => renderSD(cat), 320);
});

/* ══ 타임특가 ══ */
const tdCarousel = document.getElementById('td-carousel');
tdCarousel.innerHTML = TD_DATA.map(pr => `
  <article class="vcard">
    <div class="thumb">
      <img src="${pr.img}" alt="">
      <button class="scrap" aria-label="스크랩"></button>
      <div class="rise-badge" data-rise="${pr.rise}">내일 ${pr.rise}원 더 비싸져요</div>
    </div>
    <div class="txt">
      <p class="name">${esc(pr.name)}</p>
      <p class="price"><b class="rate">${pr.rate}</b><b>${pr.price}</b></p>
      <p class="review"><span class="star"></span><span>${pr.rating}</span><span>·</span><span>리뷰</span><span>${pr.review}</span></p>
    </div>
  </article>`).join('');

/* 스크랩 토글 */
document.querySelector('.stage').addEventListener('click', e => {
  const s = e.target.closest('.scrap');
  if (s) s.classList.toggle('is-on');
});

/* ══ 카운트다운 ══
   진입 모션: 모듈이 뷰포트에 30% 이상 보일 때, 게이지 100% → 남은시간 지점까지 1.6s 감소 후 실시간 카운트 */
const TOTAL = 24 * 3600;
let remaining = 45370, speed = 1, ended = false;
const pad = n => String(n).padStart(2, '0');
const fmt = s => `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(Math.floor(s%60))}`;
const pct = () => Math.max(0, remaining / TOTAL * 100);
const modules = [...document.querySelectorAll('.countdown-scope')];

/* 숫자 슬롯머신 롤링: 변경된 자리만 세로 슬라이드 0.28s */
function buildSlots(m) {
  const chars = fmt(remaining).split('');
  m.querySelector('.t-parts').innerHTML =
    '<span>종료시간까지</span><b class="t-remain">'
    + chars.map(c => c === ':' ? '<span class="colon">:</span>'
        : `<span class="dg"><span class="strip"><span>${c}</span></span></span>`).join('')
    + '</b><span>남음</span>';
  m._digits = chars;
  m._slots = [...m.querySelectorAll('.t-remain .dg')];
}
function rollDigit(dgEl, from, to) {
  const strip = dgEl.firstChild;
  strip.classList.remove('anim');
  strip.innerHTML = `<span>${from}</span><span>${to}</span>`;
  strip.style.transform = 'translateY(0)';
  void strip.offsetHeight;
  strip.classList.add('anim');
  strip.style.transform = 'translateY(-18px)';
}
function paintTimer() {
  const chars = fmt(remaining).split('');
  modules.forEach(m => {
    m.classList.toggle('ended', ended);
    if (ended) {
      m.querySelector('.t-parts').innerHTML = '<span>오늘 딜 종료</span>';
      m._digits = null;
      return;
    }
    if (!m._digits) buildSlots(m);
    let slot = 0;
    chars.forEach((c, i) => {
      if (c === ':') return;
      if (m._digits[i] !== c) { rollDigit(m._slots[slot], m._digits[i], c); m._digits[i] = c; }
      slot++;
    });
  });
  document.querySelectorAll('.rise-badge').forEach(b => {
    b.textContent = ended ? '오늘 딜 종료' : `내일 ${b.dataset.rise}원 더 비싸져요`;
  });
  const gc = document.getElementById('global-clock');
  if (gc) gc.textContent = ended ? '딜 종료' : `남은시간 ${fmt(remaining)}`;
}
function paintGaugeFor(m, widthPct) {
  m.querySelector('.gauge .fill').style.width = widthPct + '%';
  m.querySelector('.gauge .pin').style.left = widthPct + '%';
}

/* 진입 모션 (rAF 미의존 — 백그라운드 로드에도 안전). 모듈별 독립 재생 */
function runIntroFor(m) {
  const els = m.querySelectorAll('.gauge .fill, .gauge .pin');
  m._introRunning = true;
  els.forEach(el => el.classList.remove('intro'));
  paintGaugeFor(m, 100);
  void document.body.offsetWidth; /* 강제 reflow — 100%가 먼저 커밋되도록 */
  els.forEach(el => el.classList.add('intro'));
  paintGaugeFor(m, pct());
  clearTimeout(m._introTimer);
  m._introTimer = setTimeout(() => {
    els.forEach(el => el.classList.remove('intro'));
    m._introRunning = false;
  }, 1650);
}

let last = Date.now();
function tick() {
  const now = Date.now();
  const dt = (now - last) / 1000; last = now;
  if (!ended) {
    remaining -= dt * speed;
    if (remaining <= 0) { remaining = 0; ended = true; }
    paintTimer();
    modules.forEach(m => {
      if (m._introPlayed && !m._introRunning) paintGaugeFor(m, pct());
    });
  }
}

if (DIFF) {
  /* 정지 렌더: Figma 시안값 고정 (12:36:10, fill 256/343) — 롤링 마크업 없이 플레인 텍스트 */
  modules.forEach(m => {
    m.querySelector('.t-parts').innerHTML =
      `<span>종료시간까지</span><b>${fmt(remaining)}</b><span>남음</span>`;
    paintGaugeFor(m, 256 / 343 * 100);
  });
} else {
  paintTimer();
  /* 노출 전에는 100% 대기 → 30% 이상 보이면 1회 재생 */
  modules.forEach(m => paintGaugeFor(m, 100));
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.intersectionRatio >= 0.3 && !e.target._introPlayed) {
        e.target._introPlayed = true;
        runIntroFor(e.target);
      }
    });
  }, { threshold: [0.3] });
  modules.forEach(m => io.observe(m));
  setInterval(tick, 100);
}

/* 컨트롤 */
function bindGroup(sel, fn) {
  document.querySelectorAll(sel).forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll(sel).forEach(x => x.classList.remove('is-on'));
    b.classList.add('is-on');
    fn(b);
  }));
}
bindGroup('.preset', b => {
  remaining = Number(b.dataset.sec); ended = false;
  modules.forEach(m => { m._digits = null; });
  paintTimer();
  modules.forEach(m => { m._introPlayed = true; runIntroFor(m); });
});
bindGroup('.speed', b => { speed = Number(b.dataset.x); });

/* 로딩(진입 모션) 테스트: 30% 노출 조건을 다시 밟은 것처럼 재생 */
const replayBtn = document.querySelector('.replay-btn');
if (replayBtn) replayBtn.addEventListener('click', () => {
  modules.forEach(m => { m._introPlayed = true; runIntroFor(m); });
});

const pinBtn = document.querySelector('.pin-toggle');
if (pinBtn) pinBtn.addEventListener('click', () => {
  const on = !document.body.classList.contains('pin-on');
  document.body.classList.toggle('pin-on', on);
  pinBtn.textContent = on ? 'ON' : 'OFF';
  pinBtn.classList.toggle('is-on', on);
});
</script>
</body>
</html>
